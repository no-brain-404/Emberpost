name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify version metadata
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "## Version: ${version}" EmberPost/EmberPost.toc
          grep -Fq "version = \"${version}\"" EmberPost/Core.lua

      - name: Build addon archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -r -9 "EmberPost-${version}.zip" EmberPost
          sha256sum "EmberPost-${version}.zip" > "EmberPost-${version}.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "EmberPost-${version}.zip" \
            "EmberPost-${version}.sha256" \
            --verify-tag \
            --title "EmberPost ${version}" \
            --generate-notes
